<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>케인즈 숫자 게임</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f5f7fb;color:#111827}
.wrap{max-width:1100px;margin:auto;padding:36px 16px} h1{text-align:center;font-size:40px;margin:0 0 8px} .sub{text-align:center;color:#6b7280;margin-bottom:26px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.07)}
.entry{max-width:560px;margin:auto;padding:26px} .status{background:#f8fafc;padding:12px;border-radius:12px;text-align:center;font-weight:800;color:#475569;margin-bottom:18px}
label{display:block;font-weight:800;font-size:14px;margin:0 0 8px} input{width:100%;height:54px;border:1px solid #d1d5db;border-radius:13px;padding:0 14px;font-size:17px;margin-bottom:16px}
button{width:100%;min-height:52px;border:0;border-radius:13px;font-weight:900;font-size:16px;cursor:pointer} .submit{background:#2563eb;color:white} .resultsBtn{display:none;background:#111827;color:white;margin-top:12px}
.msg{min-height:22px;text-align:center;margin-top:12px;font-weight:800;font-size:14px} .ok{color:#059669} .err{color:#dc2626}
.done{display:none;background:#ecfdf5;border:1px solid #d1fae5;color:#047857;padding:16px;border-radius:13px;text-align:center;font-weight:800;line-height:1.6}
#resultsScreen{display:none} .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px} .panel{padding:22px} .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{background:#ecfdf5;color:#047857;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900} .tablebox{max-height:620px;overflow:auto;border:1px solid #e5e7eb;border-radius:14px}
table{width:100%;border-collapse:collapse} th,td{padding:12px 14px;border-bottom:1px solid #e5e7eb;text-align:left} th{background:#f8fafc;position:sticky;top:0;font-size:13px} td:last-child,th:last-child{text-align:right}
.target{padding:28px;text-align:center;background:#eff6ff;border:1px solid #dbeafe;border-radius:20px} .big{font-size:72px;font-weight:950;color:#1d4ed8;margin:16px 0}
.winner{margin-top:18px;padding:26px;text-align:center;background:#ecfdf5;border:1px solid #d1fae5;border-radius:20px} .winnerName{font-size:30px;font-weight:950;margin-top:10px}
.back{margin-top:14px;background:#e5e7eb} @media(max-width:800px){.grid{grid-template-columns:1fr}h1{font-size:34px}.big{font-size:60px}}
</style>
</head>
<body>
<div class="wrap">
<section id="entryScreen">
<h1>케인즈 숫자 게임</h1>
<div class="sub">0부터 100 사이의 숫자를 하나 선택하세요.</div>
<div class="card entry">
<div id="status" class="status">현재 제출 인원 확인 중…</div>
<div id="form">
<label>닉네임</label><input id="nickname" maxlength="20" autocomplete="off" placeholder="닉네임을 입력하세요">
<label>선택할 숫자</label><input id="choice" type="number" min="0" max="100" step="0.01" inputmode="decimal" placeholder="0 ~ 100">
<button id="submit" class="submit">제출</button>
</div>
<div id="done" class="done"></div>
<button id="resultsBtn" class="resultsBtn">결과 화면</button>
<div id="msg" class="msg"></div>
</div>
</section>

<section id="resultsScreen">
<h1>게임 결과</h1>
<div class="sub">새로운 제출이 들어오면 자동 갱신됩니다.</div>
<div class="grid">
<div class="card panel">
<div class="head"><h2 style="margin:0">참가자 선택</h2><span id="count" class="badge">0명 제출</span></div>
<div class="tablebox"><table><thead><tr><th>순번</th><th>닉네임</th><th>선택 숫자</th></tr></thead><tbody id="rows"></tbody></table></div>
<button id="back" class="back">입력 화면으로</button>
</div>
<div>
<div class="target"><b>전체 평균 × 2/3</b><div id="target" class="big">-</div><div id="formula" style="color:#6b7280"></div></div>
<div class="winner"><b style="color:#047857">🏆 게임의 승리자</b><div id="winnerName" class="winnerName">-</div><div id="winnerNumber" style="margin-top:8px;color:#4b5563;font-weight:800"></div></div>
</div>
</div>
</section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://clmhkplxhgfbwjexigtk.supabase.co';
const SUPABASE_KEY='sb_publishable_ZFrGWd7BCjnjeqcZema0Nw_gS1d9fDZ';
const MASTER="사회김경훈", MAX=30, RATIO=2/3;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let isMaster=false;

function deviceId(){
  let id=localStorage.getItem("keynesDevice");
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()); localStorage.setItem("keynesDevice",id); }
  return id;
}
function fmt(v){ return Number.isFinite(Number(v))?String(Number(Number(v).toFixed(2))):"-"; }
function msg(t,c=""){ $("msg").textContent=t; $("msg").className="msg "+c; }

async function loadStatus(){
  const {count,error}=await sb.from("keynes_entries").select("*",{count:"exact",head:true});
  $("status").textContent=error?"제출 인원을 불러오지 못했습니다.":`현재 제출 인원: ${count||0} / ${MAX}명`;
}

async function submit(){
  const nickname=$("nickname").value.trim(), raw=$("choice").value, choice=Number(raw);
  if(!nickname) return msg("닉네임을 입력해 주세요.","err");
  if(raw===""||!Number.isFinite(choice)||choice<0||choice>100) return msg("0부터 100 사이의 숫자를 입력해 주세요.","err");
  $("submit").disabled=true; $("submit").textContent="제출 중…"; msg("");
  const {count}=await sb.from("keynes_entries").select("*",{count:"exact",head:true});
  if((count||0)>=MAX){ msg("최대 참가 인원 30명이 모두 제출했습니다.","err"); $("submit").disabled=false; $("submit").textContent="제출"; return; }
  const {error}=await sb.from("keynes_entries").insert({nickname,choice,device_id:deviceId()});
  $("submit").disabled=false; $("submit").textContent="제출";
  if(error){
    console.error(error);
    if(error.code==="23505") msg("이미 사용된 닉네임이거나 이 기기에서 이미 제출했습니다.","err");
    else msg("제출하지 못했습니다. 잠시 후 다시 시도해 주세요.","err");
    return;
  }
  $("form").style.display="none"; $("done").style.display="block"; $("done").innerHTML=`✓ 제출되었습니다.<br><strong>${nickname}</strong> · ${fmt(choice)}`;
  msg(`${nickname}님의 숫자가 제출되었습니다.`,"ok");
  if(nickname===MASTER){ isMaster=true; $("resultsBtn").style.display="block"; }
  loadStatus();
}

async function loadResults(){
  const {data,error}=await sb.from("keynes_entries").select("nickname,choice,created_at").order("created_at",{ascending:true});
  if(error){console.error(error);return}
  render(data||[]);
}
function render(a){
  $("count").textContent=`${a.length}명 제출`;
  $("rows").innerHTML=a.length?a.map((e,i)=>`<tr><td>${i+1}</td><td>${String(e.nickname).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}</td><td>${fmt(e.choice)}</td></tr>`).join(""):`<tr><td colspan="3" style="text-align:center;color:#6b7280">아직 제출자가 없습니다.</td></tr>`;
  if(!a.length){ $("target").textContent="-"; $("formula").textContent=""; $("winnerName").textContent="-"; $("winnerNumber").textContent=""; return; }
  const avg=a.reduce((s,e)=>s+Number(e.choice),0)/a.length, target=avg*RATIO;
  $("target").textContent=fmt(target); $("formula").textContent=`전체 평균 ${fmt(avg)} × 2/3 = ${fmt(target)}`;
  const min=Math.min(...a.map(e=>Math.abs(Number(e.choice)-target)));
  const winners=a.filter(e=>Math.abs(Math.abs(Number(e.choice)-target)-min)<1e-9);
  $("winnerName").textContent=winners.map(w=>w.nickname).join(", ");
  $("winnerNumber").textContent=winners.length===1?`선택한 숫자: ${fmt(winners[0].choice)}`:`공동 승리 · 선택 숫자: ${winners.map(w=>fmt(w.choice)).join(", ")}`;
}

$("submit").onclick=submit;
$("resultsBtn").onclick=async()=>{ if(!isMaster)return; $("entryScreen").style.display="none"; $("resultsScreen").style.display="block"; await loadResults(); };
$("back").onclick=()=>{ $("resultsScreen").style.display="none"; $("entryScreen").style.display="block"; loadStatus(); };
$("nickname").addEventListener("keydown",e=>{if(e.key==="Enter")$("choice").focus()});
$("choice").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});

sb.channel("keynes-live")
.on("postgres_changes",{event:"*",schema:"public",table:"keynes_entries"},async()=>{loadStatus(); if(isMaster&&$("resultsScreen").style.display==="block") await loadResults();})
.subscribe();

loadStatus();
</script>
</body>
</html>
