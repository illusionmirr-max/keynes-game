<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>케인즈 숫자 게임</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #e8f0ff 0, transparent 38%),
        linear-gradient(180deg, #f8fafc 0%, #f5f7fb 100%);
      color: #111827;
    }

    .card {
      width: min(520px, 100%);
      padding: 38px 28px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      box-shadow: 0 20px 55px rgba(15, 23, 42, 0.10);
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: #eff6ff;
      font-size: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 14px 0 28px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.7;
    }

    .start {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      padding: 0 22px;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
    }

    .start:active {
      transform: scale(.99);
    }

    .help {
      margin-top: 22px;
      padding: 16px;
      border-radius: 14px;
      background: #f8fafc;
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }

    .url-copy {
      margin-top: 12px;
      border: 0;
      background: transparent;
      color: #2563eb;
      font-size: 13px;
      font-weight: 800;
      text-decoration: underline;
      cursor: pointer;
    }

    #copyMessage {
      min-height: 20px;
      margin-top: 8px;
      color: #059669;
      font-size: 12px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎯</div>

    <h1>케인즈 숫자 게임</h1>

    <p class="subtitle">
      아래 버튼을 눌러 게임에 참여하세요.<br>
      닉네임과 숫자를 입력하면 됩니다.
    </p>

    <a
      class="start"
      href="https://script.google.com/macros/s/AKfycbzgvBTbM3WqIpLypTbXQWIlNDpr4WX25ZDBazo7hJhgZ2ae3Pbw4SbswAOAvMr7RxxX8Q/exec"
      target="_blank"
      rel="noopener noreferrer">
      게임 시작
    </a>

    <div class="help">
      버튼을 눌렀는데 Google에서<br>
      <strong>“현재 파일을 열 수 없습니다”</strong>가 표시되면<br>
      Chrome 또는 Safari의 새 탭에서 주소를 열어 주세요.

      <br>
      <button class="url-copy" type="button" onclick="copyGameUrl()">
        게임 주소 복사하기
      </button>
      <div id="copyMessage"></div>
    </div>
  </main>

  <script>
    const GAME_URL = "https://script.google.com/macros/s/AKfycbzgvBTbM3WqIpLypTbXQWIlNDpr4WX25ZDBazo7hJhgZ2ae3Pbw4SbswAOAvMr7RxxX8Q/exec";

    async function copyGameUrl() {
      const message = document.getElementById("copyMessage");

      try {
        await navigator.clipboard.writeText(GAME_URL);
        message.textContent = "게임 주소를 복사했습니다.";
      } catch (e) {
        const textarea = document.createElement("textarea");
        textarea.value = GAME_URL;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        message.textContent = "게임 주소를 복사했습니다.";
      }
    }
  </script>
</body>
</html>
